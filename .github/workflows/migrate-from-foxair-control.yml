name: Migrate firmware research from FoxAir_Control

on:
  push:
    paths:
      - '.github/workflows/migrate-from-foxair-control.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          path: destination

      - name: Checkout FoxAir_Control
        uses: actions/checkout@v4
        with:
          repository: dosordie/FoxAir_Control
          path: source

      - name: Copy firmware/update research
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          copy_path() {
            local src="$1"
            local dst="$2"
            mkdir -p "destination/$(dirname "$dst")"
            cp -a "source/$src" "destination/$dst"
          }

          # Preserve the established project paths for migrated material.
          copy_path docs/reverse_engineering docs/reverse_engineering
          copy_path tools/phnix_ota tools/phnix_ota
          copy_path devtools/phnix_ota_lab devtools/phnix_ota_lab
          copy_path devtools/phnix_ota_sender.py devtools/phnix_ota_sender.py
          copy_path devtools/phnix_ota_board_simulator.py devtools/phnix_ota_board_simulator.py
          copy_path tests/test_phnix_ota_controller.py tests/test_phnix_ota_controller.py
          copy_path tests/test_phnix_ota_simulator.py tests/test_phnix_ota_simulator.py
          copy_path tests/test_phnix_ota_sender.py tests/test_phnix_ota_sender.py
          copy_path docs/HowTo/phnix_ota_sender.md docs/HowTo/phnix_ota_sender.md
          copy_path docs/HowTo/firmware_backup_lte.md docs/HowTo/firmware_backup_lte.md

          # Prepared locations for future firmware images and platform-specific updater builds.
          mkdir -p destination/firmware_images/{mainboard,modem,display}
          mkdir -p destination/updater/{common,linux,windows}
          touch destination/firmware_images/mainboard/.gitkeep
          touch destination/firmware_images/modem/.gitkeep
          touch destination/firmware_images/display/.gitkeep
          touch destination/updater/common/.gitkeep
          touch destination/updater/linux/.gitkeep
          touch destination/updater/windows/.gitkeep

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/destination"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs tools devtools tests firmware_images updater
          if git diff --cached --quiet; then
            echo "Nothing to migrate."
            exit 0
          fi
          git commit -m "Migrate firmware analysis and OTA tooling from FoxAir_Control"
          git push
