name: Windows Updater Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "updater/windows/**"
      - "updater/common/**"
      - "updater/dtu_ota/**"
      - "tools/phnix_ota/**"
      - ".github/workflows/windows-build.yml"
      - "LICENSE"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python for build
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read Windows app version
        id: version
        shell: powershell
        run: |
          $text = Get-Content updater/windows/foxair_updater_app.py -Raw
          $match = [regex]::Match($text, 'APP_VERSION\s*=\s*"([^"]+)"')
          if (-not $match.Success) { throw "APP_VERSION not found" }
          $version = $match.Groups[1].Value
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Windows version: $version"

      - name: Compile Windows GUI and runner sources
        shell: powershell
        run: |
          python -m py_compile updater/windows/foxair_updater_gui.py
          python -m py_compile updater/windows/foxair_updater_app.py
          python -m py_compile updater/windows/foxair_updater_runner_product.py
          python -m py_compile updater/windows/foxair_updater_runner_enduser.py
          python -m py_compile updater/windows/release_check.py
          python -m py_compile updater/dtu_ota/cli.py
          python -m py_compile updater/dtu_ota/client.py
          python -m py_compile updater/dtu_ota/package.py
          python updater/dtu_ota/cli.py --help > $null

      - name: Build portable package
        shell: cmd
        run: updater\windows\build_windows_portable.bat

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build setup
        shell: cmd
        run: updater\windows\build_windows_setup.bat

      # GitHub Actions packs every artifact into one download ZIP. Upload the
      # portable directory here, not our already-created release ZIP, so there
      # is no ZIP-inside-ZIP when downloading a test build from Actions.
      - name: Upload portable files
        uses: actions/upload-artifact@v4
        with:
          name: FoxAir_Updater_Portable_v${{ steps.version.outputs.version }}
          path: dist/FoxAir_Updater/
          if-no-files-found: error

      - name: Upload Windows setup
        uses: actions/upload-artifact@v4
        with:
          name: FoxAir_Updater_Setup_v${{ steps.version.outputs.version }}
          path: updater/windows/installer/Output/FoxAir_Updater_Setup_v${{ steps.version.outputs.version }}.exe
          if-no-files-found: error
