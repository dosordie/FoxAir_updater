name: Windows Updater Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "updater/windows/**"
      - "updater/common/**"
      - "tools/phnix_ota/**"
      - ".github/workflows/windows-build.yml"
      - "LICENSE"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python for build
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read Windows app version
        id: version
        shell: powershell
        run: |
          $text = Get-Content updater/windows/foxair_updater_gui.py -Raw
          $match = [regex]::Match($text, 'APP_VERSION\s*=\s*"([^"]+)"')
          if (-not $match.Success) { throw "APP_VERSION not found" }
          $version = $match.Groups[1].Value
          $tag = "windows-v$version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Windows version: $version"

      - name: Build portable package
        shell: cmd
        run: updater\windows\build_windows_portable.bat

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build setup
        shell: cmd
        run: updater\windows\build_windows_setup.bat

      # Actions artifacts are themselves downloaded as ZIP archives. Upload the
      # portable directory here, not our already zipped release asset, so an
      # Actions download is no longer ZIP-inside-ZIP.
      - name: Upload portable files
        uses: actions/upload-artifact@v4
        with:
          name: FoxAir_Updater_Portable_v${{ steps.version.outputs.version }}
          path: dist/FoxAir_Updater/
          if-no-files-found: error

      - name: Upload Windows setup
        uses: actions/upload-artifact@v4
        with:
          name: FoxAir_Updater_Setup_v${{ steps.version.outputs.version }}
          path: updater/windows/installer/Output/FoxAir_Updater_Setup_v${{ steps.version.outputs.version }}.exe
          if-no-files-found: error

      - name: Publish Windows prerelease
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.version }}
          WINDOWS_RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $tag = $env:WINDOWS_RELEASE_TAG
          $version = $env:APP_VERSION
          $portable = "dist/FoxAir_Updater_Portable_v$version.zip"
          $setup = "updater/windows/installer/Output/FoxAir_Updater_Setup_v$version.exe"

          if (-not (Test-Path $portable)) { throw "Portable ZIP missing: $portable" }
          if (-not (Test-Path $setup)) { throw "Setup missing: $setup" }

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; leaving the published release unchanged."
            exit 0
          }

          $notes = @"
          Experimentelle Windows-Version des FoxAir Updaters.

          - Portable ZIP und Setup EXE
          - ADB ist nicht enthalten; die GUI verweist auf die offiziellen Android Platform Tools.
          - Die Windows-GUI verwendet weiterhin den bestehenden gemeinsamen Python-OTA-Controller.
          - Ein echter Firmware-Versionswechsel ist weiterhin noch nicht live validiert.
          "@

          gh release create $tag `
            $portable `
            $setup `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "FoxAir Updater Windows v$version" `
            --notes $notes `
            --prerelease
