name: Windows Updater Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/dtu-v1-build-profiles

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python for build
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read Windows app version
        id: version
        shell: powershell
        run: |
          $text = Get-Content updater/windows/foxair_updater_app.py -Raw
          $match = [regex]::Match($text, 'APP_VERSION\s*=\s*"([^"]+)"')
          if (-not $match.Success) { throw "APP_VERSION not found" }
          $version = $match.Groups[1].Value
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Windows version: $version"

      - name: Compile Windows GUI and runner sources
        shell: powershell
        run: |
          python -m py_compile updater/windows/foxair_updater_gui.py
          python -m py_compile updater/windows/foxair_updater_app.py
          python -m py_compile updater/windows/foxair_updater_runner_product.py
          python -m py_compile updater/windows/foxair_updater_runner_enduser.py
          python -m py_compile updater/windows/release_check.py
          python -m py_compile updater/dtu_ota/cli.py
          python -m py_compile updater/dtu_ota/client.py
          python -m py_compile updater/dtu_ota/package.py
          python updater/dtu_ota/cli.py --help > $null

      - name: Test V1.0/V1.2 build profiles and experimental payload
        shell: powershell
        run: |
          python -m unittest discover -s tests -p "test_dtu_build_profiles.py"
          python -m unittest discover -s tests -p "test_dtu_v10_payload.py"
          python -m unittest discover -s tests -p "test_dtu_v10_runtime_probe.py"
          python -m unittest discover -s tests -p "test_dtu_v10_static_checker.py"
          python -m unittest discover -s tests -p "test_dtu_ota_runner.py"
          python -m unittest discover -s tests -p "test_phnix_modem_info.py"

      - name: Build portable package
        shell: cmd
        run: updater\windows\build_windows_portable.bat

      - name: Verify both DTU payloads are bundled into Windows
        shell: powershell
        run: |
          $payload = "dist/FoxAir_Updater/backend/updater/dtu_ota/payload"
          foreach ($name in @("phnix_ota_runtime_hook",
                               "phnix_ota_runtime_hook_v10",
                               "dtu_ota_supervisor.sh",
                               "dtu_ota_supervisor_v10.sh")) {
            $file = Join-Path $payload $name
            if (-not (Test-Path $file)) { throw "Windows artifact missing $file" }
          }
          python updater/windows/verify_windows_backend.py --root . --out dist/FoxAir_Updater

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build setup
        shell: cmd
        run: updater\windows\build_windows_setup.bat

      # GitHub Actions packs every artifact into one download ZIP. Upload the
      # portable directory here, not our already-created release ZIP, so there
      # is no ZIP-inside-ZIP when downloading a test build from Actions.
      - name: Upload portable files
        uses: actions/upload-artifact@v4
        with:
          name: FoxAir_Updater_Portable_v${{ steps.version.outputs.version }}
          path: dist/FoxAir_Updater/
          if-no-files-found: error

      - name: Upload Windows setup
        uses: actions/upload-artifact@v4
        with:
          name: FoxAir_Updater_Setup_v${{ steps.version.outputs.version }}
          path: updater/windows/installer/Output/FoxAir_Updater_Setup_v${{ steps.version.outputs.version }}.exe
          if-no-files-found: error
