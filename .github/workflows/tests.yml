name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: python -m py_compile updater/windows/foxair_updater_gui.py updater/windows/foxair_updater_app.py updater/windows/foxair_updater_desktop.py updater/windows/foxair_updater_lte_diagnostics.py updater/windows/foxair_updater_operator_display.py updater/windows/release_check.py updater/common/adb_transport.py updater/common/phnix_modem_info.py updater/common/network_operators.py

  vm-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tests/run_phnix_vm_matrix.py

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh -n tools/phnix_ota/phnix_ota_runtime_hook
      - run: sh -n tools/phnix_ota/phnix-ota-sim
      - run: sh -n tools/phnix_ota/phnix-sim-adb
