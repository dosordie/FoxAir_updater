name: Release Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Windows release version, for example 0.1.8"
        required: true
        type: string
      prerelease:
        description: "Mark GitHub Release as prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-windows
  cancel-in-progress: false

jobs:
  release-windows:
    name: Build and publish Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Validate version and tag
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must use x.y.z, for example 0.1.8"
          }
          git fetch origin main --tags
          $tag = "windows-v$env:VERSION"
          if (git tag --list $tag) {
            throw "Tag $tag already exists. Choose a new version."
          }

      - name: Set Windows release version
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'

          $appFile = 'updater/windows/foxair_updater_app.py'
          $app = Get-Content $appFile -Raw
          $app = $app -replace '(?m)^APP_VERSION\s*=\s*"[^"]+"', "APP_VERSION = `"$env:VERSION`""
          Set-Content -Path $appFile -Value $app -NoNewline -Encoding utf8

          # Keep the underlying base-GUI source version synchronized as well.
          $guiFile = 'updater/windows/foxair_updater_gui.py'
          $gui = Get-Content $guiFile -Raw
          $gui = $gui -replace '(?m)^APP_VERSION\s*=\s*"[^"]+"', "APP_VERSION = `"$env:VERSION`""
          Set-Content -Path $guiFile -Value $gui -NoNewline -Encoding utf8

          $buildFile = 'updater/windows/build_windows_portable.bat'
          $build = Get-Content $buildFile -Raw
          $build = $build -replace '(?m)^set "APP_VERSION=[^"]+"', "set `"APP_VERSION=$env:VERSION`""
          Set-Content -Path $buildFile -Value $build -NoNewline -Encoding ascii

          $issFile = 'updater/windows/installer/FoxAir_Updater.iss'
          $iss = Get-Content $issFile -Raw
          $iss = $iss -replace '(?m)^#define MyAppVersion "[^"]+"', "#define MyAppVersion `"$env:VERSION`""
          Set-Content -Path $issFile -Value $iss -NoNewline -Encoding utf8

      - name: Verify synchronized Windows version
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Select-String -Path updater/windows/foxair_updater_app.py -Pattern '^APP_VERSION\s*=\s*"(.+)"$'
          $gui = Select-String -Path updater/windows/foxair_updater_gui.py -Pattern '^APP_VERSION\s*=\s*"(.+)"$'
          $bat = Select-String -Path updater/windows/build_windows_portable.bat -Pattern '^set "APP_VERSION=([^"]+)"$'
          $iss = Select-String -Path updater/windows/installer/FoxAir_Updater.iss -Pattern '^#define MyAppVersion "([^"]+)"$'
          if (-not $app -or $app.Matches[0].Groups[1].Value -ne $env:VERSION) { throw 'App entrypoint version mismatch' }
          if (-not $gui -or $gui.Matches[0].Groups[1].Value -ne $env:VERSION) { throw 'Base GUI version mismatch' }
          if (-not $bat -or $bat.Matches[0].Groups[1].Value -ne $env:VERSION) { throw 'Portable build version mismatch' }
          if (-not $iss -or $iss.Matches[0].Groups[1].Value -ne $env:VERSION) { throw 'Installer version mismatch' }

      - name: Setup Python for build
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Windows GUI sources
        shell: pwsh
        run: |
          python -m py_compile updater/windows/foxair_updater_gui.py
          python -m py_compile updater/windows/foxair_updater_app.py
          python -m py_compile updater/windows/release_check.py
          python -m py_compile updater/windows/phnix_windows_controller_wrapper.py

      - name: Build portable package
        shell: cmd
        run: updater\windows\build_windows_portable.bat

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build setup
        shell: cmd
        run: updater\windows\build_windows_setup.bat

      - name: Verify release assets
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $portable = "dist/FoxAir_Updater_Portable_v$env:VERSION.zip"
          $setup = "updater/windows/installer/Output/FoxAir_Updater_Setup_v$env:VERSION.exe"
          if (-not (Test-Path $portable)) { throw "Portable ZIP missing: $portable" }
          if (-not (Test-Path $setup)) { throw "Setup EXE missing: $setup" }

          $portableCheck = Join-Path $env:RUNNER_TEMP 'foxair-portable-check'
          if (Test-Path $portableCheck) { Remove-Item -Recurse -Force $portableCheck }
          Expand-Archive -Path $portable -DestinationPath $portableCheck
          if (-not (Test-Path (Join-Path $portableCheck 'FoxAir_Updater.exe'))) {
            throw 'Portable ZIP does not contain FoxAir_Updater.exe at its root'
          }
          if (-not (Test-Path (Join-Path $portableCheck 'runtime/python.exe'))) {
            throw 'Portable ZIP does not contain its private Python runtime'
          }
          if (-not (Test-Path (Join-Path $portableCheck 'backend/updater/common/phnix_statistics_maintenance.py'))) {
            throw 'Portable ZIP does not contain the shared maintenance core'
          }
          if (Get-ChildItem -Path $portableCheck -Recurse -Filter 'FoxAir_Updater_Setup_*.exe') {
            throw 'Portable ZIP unexpectedly contains a setup executable'
          }

      - name: Commit release version and push tag
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updater/windows/foxair_updater_app.py updater/windows/foxair_updater_gui.py updater/windows/build_windows_portable.bat updater/windows/installer/FoxAir_Updater.iss

          $PSNativeCommandUseErrorActionPreference = $false
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Release Windows v$env:VERSION"
            git push origin HEAD:main
          } else {
            Write-Host 'Version files already contain the requested version.'
          }

          $tag = "windows-v$env:VERSION"
          git tag $tag
          git push origin $tag

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v${{ inputs.version }}
          name: FoxAir Updater Windows v${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          body: |
            Experimentelle Windows-Version des FoxAir Updaters.

            - Portable ZIP und Setup EXE. Die Builds sind derzeit nicht kommerziell code-signiert; Windows SmartScreen kann deshalb beim ersten Start "Weitere Informationen" → "Trotzdem ausführen" verlangen.
            - ADB ist nicht enthalten; die GUI verweist zuerst auf den SIMCom USB-Treiber und danach auf die offiziellen Android Platform Tools.
            - Einfache read-only Updateprüfung gegen das neueste GitHub Release; Download/Installation erfolgen nicht automatisch.
            - ADB-Pfad, Remote-ADB-Modus, Raspberry-Pi-IP/Port, Backup-Ziel und zuletzt verwendete Firmware-/Manifestordner werden persistent gespeichert.
            - v0.1.8 korrigiert das Laden von Remote-IP/Port, sodass gespeicherte Werte beim Programmstart nicht mehr durch leere/default Werte überschrieben werden.
            - v0.1.8 korrigiert den Windows-Same-Version-Abschluss: Wrapper und Controller verwenden für die Abschlussprüfung exakt denselben effektiven --state-dir; alte Run-State-Dateien werden nicht als aktueller Abschlussbeweis wiederverwendet.
            - Lokaler und optionaler Remote-ADB-Modus über einen Raspberry Pi.
            - Benutzerfreundliche Dry-Run-/OTA-Statusanzeige mit farbigen Prüfschritten und Fortschrittsbalken.
            - Der Windows-/Remote-ADB-Pfad wurde real bis zur sicheren V3.3→V3.3-Gleichversionsablehnung bestätigt; dabei wurden keine Firmwaredaten übertragen.
            - Ein echter Firmware-Versionswechsel mit C5A8-Datenübertragung ist weiterhin noch nicht live validiert.
            - Die gemeinsame sicherheitsrelevante OTA-Logik bleibt im bytegleich übernommenen Python-Controller-Core.
          files: |
            dist/FoxAir_Updater_Portable_v${{ inputs.version }}.zip
            updater/windows/installer/Output/FoxAir_Updater_Setup_v${{ inputs.version }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}