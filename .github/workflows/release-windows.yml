name: Release Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Windows release version, for example 0.4.0"
        required: true
        type: string
      prerelease:
        description: "Mark GitHub Release as prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-windows
  cancel-in-progress: false

jobs:
  release-windows:
    name: Build and publish Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Validate version and tag
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must use x.y.z, for example 0.4.0"
          }
          git fetch origin main --tags
          $tag = "windows-v$env:VERSION"
          if (git tag --list $tag) {
            throw "Tag $tag already exists. Choose a new version."
          }

      - name: Set Windows release version
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'

          $appFile = 'updater/windows/foxair_updater_app.py'
          $app = Get-Content $appFile -Raw
          $app = $app -replace '(?m)^APP_VERSION\s*=\s*"[^"]+"', "APP_VERSION = `"$env:VERSION`""
          Set-Content -Path $appFile -Value $app -NoNewline -Encoding utf8

          $guiFile = 'updater/windows/foxair_updater_gui.py'
          $gui = Get-Content $guiFile -Raw
          $gui = $gui -replace '(?m)^APP_VERSION\s*=\s*"[^"]+"', "APP_VERSION = `"$env:VERSION`""
          Set-Content -Path $guiFile -Value $gui -NoNewline -Encoding utf8

          $buildFile = 'updater/windows/build_windows_portable.bat'
          $build = Get-Content $buildFile -Raw
          $build = $build -replace '(?m)^set "APP_VERSION=[^"]+"', "set `"APP_VERSION=$env:VERSION`""
          Set-Content -Path $buildFile -Value $build -NoNewline -Encoding ascii

          $issFile = 'updater/windows/installer/FoxAir_Updater.iss'
          $iss = Get-Content $issFile -Raw
          $iss = $iss -replace '(?m)^#define MyAppVersion "[^"]+"', "#define MyAppVersion `"$env:VERSION`""
          Set-Content -Path $issFile -Value $iss -NoNewline -Encoding utf8

      - name: Verify synchronized Windows version
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Select-String -Path updater/windows/foxair_updater_app.py -Pattern '^APP_VERSION\s*=\s*"(.+)"$'
          $gui = Select-String -Path updater/windows/foxair_updater_gui.py -Pattern '^APP_VERSION\s*=\s*"(.+)"$'
          $bat = Select-String -Path updater/windows/build_windows_portable.bat -Pattern '^set "APP_VERSION=([^"]+)"$'
          $iss = Select-String -Path updater/windows/installer/FoxAir_Updater.iss -Pattern '^#define MyAppVersion "([^"]+)"$'
          if (-not $app -or $app.Matches[0].Groups[1].Value -ne $env:VERSION) { throw 'App entrypoint version mismatch' }
          if (-not $gui -or $gui.Matches[0].Groups[1].Value -ne $env:VERSION) { throw 'Base GUI version mismatch' }
          if (-not $bat -or $bat.Matches[0].Groups[1].Value -ne $env:VERSION) { throw 'Portable build version mismatch' }
          if (-not $iss -or $iss.Matches[0].Groups[1].Value -ne $env:VERSION) { throw 'Installer version mismatch' }

      - name: Setup Python for build
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run regression tests
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Compile Windows GUI and runner sources
        shell: pwsh
        run: |
          python -m py_compile updater/windows/foxair_updater_gui.py
          python -m py_compile updater/windows/foxair_updater_app.py
          python -m py_compile updater/windows/foxair_updater_runner_gui.py
          python -m py_compile updater/windows/foxair_updater_runner_user_gui.py
          python -m py_compile updater/windows/foxair_updater_runner_enduser.py
          python -m py_compile updater/windows/foxair_updater_runner_product.py
          python -m py_compile updater/windows/foxair_updater_maintenance.py
          python -m py_compile updater/windows/release_check.py
          python -m py_compile updater/windows/phnix_windows_controller_wrapper.py
          python -m py_compile updater/common/phnix_statistics_maintenance.py
          python -m py_compile updater/common/phnix_statistics_counters.py
          python -m py_compile updater/common/phnix_service_restart.py
          python -m py_compile updater/dtu_ota/cli.py
          python -m py_compile updater/dtu_ota/client.py
          python -m py_compile updater/dtu_ota/package.py
          python updater/dtu_ota/cli.py --help > $null
          python updater/common/phnix_statistics_counters.py --help > $null

      - name: Validate runner shell payloads
        shell: bash
        run: |
          sh -n updater/dtu_ota/payload/phnix_ota_runtime_hook
          sh -n updater/dtu_ota/payload/dtu_ota_supervisor.sh

      - name: Build portable package
        shell: cmd
        run: updater\windows\build_windows_portable.bat

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build setup
        shell: cmd
        run: updater\windows\build_windows_setup.bat

      - name: Verify release assets
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $portable = "dist/FoxAir_Updater_Portable_v$env:VERSION.zip"
          $setup = "updater/windows/installer/Output/FoxAir_Updater_Setup_v$env:VERSION.exe"
          if (-not (Test-Path $portable)) { throw "Portable ZIP missing: $portable" }
          if (-not (Test-Path $setup)) { throw "Setup EXE missing: $setup" }

          $portableCheck = Join-Path $env:RUNNER_TEMP 'foxair-portable-check'
          if (Test-Path $portableCheck) { Remove-Item -Recurse -Force $portableCheck }
          Expand-Archive -Path $portable -DestinationPath $portableCheck
          if (-not (Test-Path (Join-Path $portableCheck 'FoxAir_Updater.exe'))) {
            throw 'Portable ZIP does not contain FoxAir_Updater.exe at its root'
          }
          if (-not (Test-Path (Join-Path $portableCheck 'runtime/python.exe'))) {
            throw 'Portable ZIP does not contain its private Python runtime'
          }
          if (-not (Test-Path (Join-Path $portableCheck 'backend/updater/common/phnix_statistics_maintenance.py'))) {
            throw 'Portable ZIP does not contain the shared maintenance core'
          }
          if (-not (Test-Path (Join-Path $portableCheck 'backend/updater/common/phnix_statistics_counters.py'))) {
            throw 'Portable ZIP does not contain the multi-counter maintenance core'
          }
          if (-not (Test-Path (Join-Path $portableCheck 'backend/updater/common/phnix_service_restart.py'))) {
            throw 'Portable ZIP does not contain the shared service-restart helper'
          }
          if (-not (Test-Path (Join-Path $portableCheck 'backend/updater/dtu_ota/cli.py'))) {
            throw 'Portable ZIP does not contain the production DTU runner CLI'
          }
          if (-not (Test-Path (Join-Path $portableCheck 'backend/updater/dtu_ota/payload/dtu_ota_supervisor.sh'))) {
            throw 'Portable ZIP does not contain the DTU runner supervisor payload'
          }
          if (-not (Test-Path (Join-Path $portableCheck 'backend/updater/dtu_ota/payload/phnix_ota_runtime_hook'))) {
            throw 'Portable ZIP does not contain the DTU runtime hook payload'
          }
          if (Test-Path (Join-Path $portableCheck 'backend/tools/dtu_ota_runner')) {
            throw 'Portable ZIP unexpectedly contains the obsolete tools/dtu_ota_runner package'
          }
          if (Get-ChildItem -Path $portableCheck -Recurse -Filter 'FoxAir_Updater_Setup_*.exe') {
            throw 'Portable ZIP unexpectedly contains a setup executable'
          }

          & (Join-Path $portableCheck 'runtime/python.exe') (Join-Path $portableCheck 'backend/updater/dtu_ota/cli.py') --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Packaged DTU runner CLI did not start with private runtime' }
          & (Join-Path $portableCheck 'runtime/python.exe') (Join-Path $portableCheck 'backend/updater/common/phnix_statistics_counters.py') --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Packaged statistics counter core did not start with private runtime' }

      - name: Commit release version and push tag
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updater/windows/foxair_updater_app.py updater/windows/foxair_updater_gui.py updater/windows/build_windows_portable.bat updater/windows/installer/FoxAir_Updater.iss

          $PSNativeCommandUseErrorActionPreference = $false
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Release Windows v$env:VERSION"
            git push origin HEAD:main
          } else {
            Write-Host 'Version files already contain the requested version.'
          }

          $tag = "windows-v$env:VERSION"
          git tag $tag
          git push origin $tag

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v${{ inputs.version }}
          name: FoxAir Updater Windows v${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          body: |
            FoxAir Updater für Windows – Portable ZIP und Setup EXE.

            - Vollständige Mainboard-Firmwarewechsel V3.3 → V3.4 sowie V1.2 → V3.4 wurden auf realer FoxAir-/PHNIX-Hardware erfolgreich durchgeführt.
            - Der produktive Mainboard-OTA läuft über den autonomen DTU-Runner. Nach erfolgreichem Start führt das LTE-Modem den Updatevorgang selbstständig weiter; ein kurzfristiger Windows-/ADB-Verbindungsverlust beendet den laufenden OTA nicht.
            - Der gespeicherte Runner-Zustand kann über „Status prüfen“ erneut eingelesen werden, ohne einen zweiten Updatevorgang zu starten.
            - 100 % Fortschritt bedeutet nur vollständige Firmwareübertragung; erst die finale Mainboardbestätigung Status 5 / Board-Step 12 gilt als terminaler Erfolg.
            - MQTT bleibt beim normalen Vollupdate standardmäßig verbunden. Die MQTT-Isolierung ist optional unter „Erweitert → MQTT bei Update aus“ verfügbar.
            - Der kontrollierte phnixIot4G-Neustart kann vor dem Update angefordert werden und wird durch den Runner anhand einer neuen stabilen Dienstinstanz verifiziert.
            - Shell-Payloads werden vor Hashing und Übertragung auf LF normalisiert, damit Windows-Checkouts keine nicht ausführbaren CRLF-Hooks erzeugen.
            - Read-only Backup, Vorprüfung, Manifest-Prüfung, Status/Wiederherstellung, LTE-/Modemdiagnose und Protokollexport sind integriert.
            - Die Wartungsoberfläche unterstützt ausgewählte persistente PHNIX-Statistikzähler mit Backup sowie Datei-/RAM-Verifikation.
            - Portable ZIP und Setup EXE sind derzeit nicht kommerziell code-signiert; Windows SmartScreen kann deshalb beim ersten Start „Weitere Informationen“ → „Trotzdem ausführen“ verlangen.
            - ADB ist nicht enthalten; die GUI verweist auf den SIMCom USB-Treiber und die offiziellen Android Platform Tools.
            - Lokaler und optionaler Remote-ADB-Modus über einen Raspberry Pi werden unterstützt.
            - Der autonome DTU-Runner liegt produktiv unter updater/dtu_ota; Test- und Simulatorcode bleibt davon getrennt.

            Weitere technische Details stehen in README.md und unter docs/.
          files: |
            dist/FoxAir_Updater_Portable_v${{ inputs.version }}.zip
            updater/windows/installer/Output/FoxAir_Updater_Setup_v${{ inputs.version }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
