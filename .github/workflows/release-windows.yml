name: Release Windows

on:
  # Explicit one-off release trigger committed to main after merging the
  # validated V1.0/V1.2 profile implementation. Unrelated pushes never publish.
  push:
    branches: [main]
    paths:
      - ".github/release-requests/windows-v0.5.3.txt"
  workflow_dispatch:
    inputs:
      version:
        description: "Windows release version, for example 0.4.0"
        required: true
        type: string
      prerelease:
        description: "Mark GitHub Release as prerelease"
        required: true
        default: false
        type: boolean
      build_only:
        description: "Build only: use selected branch, upload artifacts, do not commit/tag/release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-windows
  cancel-in-progress: false

jobs:
  release-windows:
    name: Build and publish Windows release
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ github.event_name == 'push' && '0.5.3' || inputs.version }}

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Validate release branch
        if: ${{ github.event_name == 'push' || !inputs.build_only }}
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -ne "main") {
            throw "Publishing a Windows release is only allowed from main. Use build_only=true for branch builds."
          }

      - name: Validate version and tag
        shell: pwsh
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must use x.y.z, for example 0.4.0"
          }
          if ("${{ github.event_name }}" -eq "push" -or "${{ inputs.build_only }}" -ne "true") {
            git fetch origin main --tags
            $tag = "windows-v$env:VERSION"
            if (git tag --list $tag) {
              throw "Tag $tag already exists. Choose a new version."
            }
          }

      - name: Set Windows release version
        shell: pwsh
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          $ErrorActionPreference = 'Stop'

          $appFile = 'updater/windows/foxair_updater_app.py'
          $app = Get-Content $appFile -Raw
          $app = $app -replace '(?m)^APP_VERSION\s*=\s*"[^"]+"', "APP_VERSION = `"$env:VERSION`""
          Set-Content -Path $appFile -Value $app -NoNewline -Encoding utf8

          $guiFile = 'updater/windows/foxair_updater_gui.py'
          $gui = Get-Content $guiFile -Raw
          $gui = $gui -replace '(?m)^APP_VERSION\s*=\s*"[^"]+"', "APP_VERSION = `"$env:VERSION`""
          Set-Content -Path $guiFile -Value $gui -NoNewline -Encoding utf8

          $buildFile = 'updater/windows/build_windows_portable.bat'
          $build = Get-Content $buildFile -Raw
          $build = $build -replace '(?m)^set "APP_VERSION=[^"]+"', "set `"APP_VERSION=$env:VERSION`""
          Set-Content -Path $buildFile -Value $build -NoNewline -Encoding ascii

          $issFile = 'updater/windows/installer/FoxAir_Updater.iss'
          $iss = Get-Content $issFile -Raw
          $iss = $iss -replace '(?m)^#define MyAppVersion "[^"]+"', "#define MyAppVersion `"$env:VERSION`""
          Set-Content -Path $issFile -Value $iss -NoNewline -Encoding utf8

      - name: Verify synchronized Windows version
        shell: pwsh
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Select-String -Path updater/windows/foxair_updater_app.py -Pattern '^APP_VERSION\s*=\s*"(.+)"$'
          $gui = Select-String -Path updater/windows/foxair_updater_gui.py -Pattern '^APP_VERSION\s*=\s*"(.+)"$'
          $bat = Select-String -Path updater/windows/build_windows_portable.bat -Pattern '^set "APP_VERSION=([^"]+)"$'
          $iss = Select-String -Path updater/windows/installer/FoxAir_Updater.iss -Pattern '^#define MyAppVersion "([^"]+)"$'
          if (-not $app -or $app.Matches[0].Groups[1].Value -ne $env:VERSION) { throw 'App entrypoint version mismatch' }
          if (-not $gui -or $gui.Matches[0].Groups[1].Value -ne $env:VERSION) { throw 'Base GUI version mismatch' }
          if (-not $bat -or $bat.Matches[0].Groups[1].Value -ne $env:VERSION) { throw 'Portable build version mismatch' }
          if (-not $iss -or $iss.Matches[0].Groups[1].Value -ne $env:VERSION) { throw 'Installer version mismatch' }

      - name: Setup Python for build
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run regression tests
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Compile Windows GUI and runner sources
        shell: pwsh
        run: |
          python -m py_compile updater/windows/foxair_updater_gui.py
          python -m py_compile updater/windows/foxair_updater_app.py
          python -m py_compile updater/windows/foxair_updater_runner_gui.py
          python -m py_compile updater/windows/foxair_updater_runner_user_gui.py
          python -m py_compile updater/windows/foxair_updater_runner_enduser.py
          python -m py_compile updater/windows/foxair_updater_runner_product.py
          python -m py_compile updater/windows/foxair_updater_maintenance.py
          python -m py_compile updater/windows/release_check.py
          python -m py_compile updater/common/phnix_statistics_maintenance.py
          python -m py_compile updater/common/phnix_statistics_counters.py
          python -m py_compile updater/common/phnix_service_restart.py
          python -m py_compile updater/dtu_ota/cli.py
          python -m py_compile updater/dtu_ota/client.py
          python -m py_compile updater/dtu_ota/package.py
          python -m py_compile updater/dtu_ota/original_state.py
          python -m py_compile updater/windows/prepare_runtime_hook.py
          python updater/dtu_ota/cli.py --help > $null
          python updater/dtu_ota/original_state.py --help > $null
          python updater/common/phnix_statistics_counters.py --help > $null

      - name: Validate runner shell payloads
        shell: bash
        run: |
          sh -n updater/dtu_ota/payload/phnix_ota_runtime_hook
          sh -n updater/dtu_ota/payload/dtu_ota_supervisor.sh
          sh -n updater/dtu_ota/payload/phnix_ota_runtime_hook_v10
          sh -n updater/dtu_ota/payload/dtu_ota_supervisor_v10.sh

      - name: Build portable package
        shell: cmd
        run: updater\windows\build_windows_portable.bat

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build setup
        shell: cmd
        run: updater\windows\build_windows_setup.bat

      - name: Verify release assets
        shell: pwsh
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          $ErrorActionPreference = 'Stop'
          $portable = "dist/FoxAir_Updater_Portable_v$env:VERSION.zip"
          $setup = "updater/windows/installer/Output/FoxAir_Updater_Setup_v$env:VERSION.exe"
          if (-not (Test-Path $portable)) { throw "Portable ZIP missing: $portable" }
          if (-not (Test-Path $setup)) { throw "Setup EXE missing: $setup" }

          $portableCheck = Join-Path $env:RUNNER_TEMP 'foxair-portable-check'
          if (Test-Path $portableCheck) { Remove-Item -Recurse -Force $portableCheck }
          Expand-Archive -Path $portable -DestinationPath $portableCheck
          if (-not (Test-Path (Join-Path $portableCheck 'FoxAir_Updater.exe'))) {
            throw 'Portable ZIP does not contain FoxAir_Updater.exe at its root'
          }
          if (-not (Test-Path (Join-Path $portableCheck 'runtime/python.exe'))) {
            throw 'Portable ZIP does not contain its private Python runtime'
          }
          if (-not (Test-Path (Join-Path $portableCheck 'backend/updater/common/phnix_statistics_maintenance.py'))) {
            throw 'Portable ZIP does not contain the shared maintenance core'
          }
          if (-not (Test-Path (Join-Path $portableCheck 'backend/updater/common/phnix_statistics_counters.py'))) {
            throw 'Portable ZIP does not contain the multi-counter maintenance core'
          }
          if (-not (Test-Path (Join-Path $portableCheck 'backend/updater/common/phnix_service_restart.py'))) {
            throw 'Portable ZIP does not contain the shared service-restart helper'
          }
          if (-not (Test-Path (Join-Path $portableCheck 'backend/updater/dtu_ota/cli.py'))) {
            throw 'Portable ZIP does not contain the production DTU runner CLI'
          }
          if (-not (Test-Path (Join-Path $portableCheck 'backend/updater/dtu_ota/original_state.py'))) {
            throw 'Portable ZIP does not contain the shared original-state core'
          }
          if (-not (Test-Path (Join-Path $portableCheck 'backend/updater/dtu_ota/payload/dtu_ota_supervisor.sh'))) {
            throw 'Portable ZIP does not contain the DTU runner supervisor payload'
          }
          if (-not (Test-Path (Join-Path $portableCheck 'backend/updater/dtu_ota/payload/phnix_ota_runtime_hook'))) {
            throw 'Portable ZIP does not contain the DTU runtime hook payload'
          }
          foreach ($name in @('phnix_ota_runtime_hook_v10', 'dtu_ota_supervisor_v10.sh')) {
            if (-not (Test-Path (Join-Path $portableCheck "backend/updater/dtu_ota/payload/$name"))) {
              throw "Portable ZIP missing V1.0-specific OTA payload: $name"
            }
          }
          if (Test-Path (Join-Path $portableCheck 'backend/tools/dtu_ota_runner')) {
            throw 'Portable ZIP unexpectedly contains the obsolete tools/dtu_ota_runner package'
          }
          if (Get-ChildItem -Path $portableCheck -Recurse -Filter 'phnix_local_ota_controller*.py') {
            throw 'Portable ZIP unexpectedly contains a legacy host OTA controller'
          }
          if (Get-ChildItem -Path $portableCheck -Recurse -Filter 'phnix_windows_controller_wrapper*.py') {
            throw 'Portable ZIP unexpectedly contains a legacy Windows controller wrapper'
          }
          if (Get-ChildItem -Path $portableCheck -Recurse -Filter 'FoxAir_Updater_Setup_*.exe') {
            throw 'Portable ZIP unexpectedly contains a setup executable'
          }

          & (Join-Path $portableCheck 'runtime/python.exe') (Join-Path $portableCheck 'backend/updater/dtu_ota/cli.py') --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Packaged DTU runner CLI did not start with private runtime' }
          & (Join-Path $portableCheck 'runtime/python.exe') (Join-Path $portableCheck 'backend/updater/dtu_ota/original_state.py') --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Packaged original-state core did not start with private runtime' }
          & (Join-Path $portableCheck 'runtime/python.exe') (Join-Path $portableCheck 'backend/updater/common/phnix_statistics_counters.py') --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Packaged statistics counter core did not start with private runtime' }

      - name: Upload build-only portable ZIP
        if: ${{ github.event_name != 'push' && inputs.build_only }}
        uses: actions/upload-artifact@v4
        with:
          name: FoxAir_Updater_Portable_v${{ env.RELEASE_VERSION }}_${{ github.ref_name }}
          path: dist/FoxAir_Updater_Portable_v${{ env.RELEASE_VERSION }}.zip
          if-no-files-found: error

      - name: Upload build-only Windows setup
        if: ${{ github.event_name != 'push' && inputs.build_only }}
        uses: actions/upload-artifact@v4
        with:
          name: FoxAir_Updater_Setup_v${{ env.RELEASE_VERSION }}_${{ github.ref_name }}
          path: updater/windows/installer/Output/FoxAir_Updater_Setup_v${{ env.RELEASE_VERSION }}.exe
          if-no-files-found: error

      - name: Commit release version and push tag
        if: ${{ github.event_name == 'push' || !inputs.build_only }}
        shell: pwsh
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updater/windows/foxair_updater_app.py updater/windows/foxair_updater_gui.py updater/windows/build_windows_portable.bat updater/windows/installer/FoxAir_Updater.iss

          $PSNativeCommandUseErrorActionPreference = $false
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Release Windows v$env:VERSION"
            git push origin HEAD:main
          } else {
            Write-Host 'Version files already contain the requested version.'
          }

          $tag = "windows-v$env:VERSION"
          git tag $tag
          git push origin $tag

      - name: Create GitHub Release
        if: ${{ github.event_name == 'push' || !inputs.build_only }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v${{ env.RELEASE_VERSION }}
          name: FoxAir Updater Windows v${{ env.RELEASE_VERSION }}
          prerelease: ${{ github.event_name != 'push' && inputs.prerelease }}
          body: |
            FoxAir Updater Windows v0.5.3 – Stable Release für DTU V1.0 und V1.2.

            ### Neu in v0.5.3
            - **DTU-Build im Klartext bei der Vorprüfung:** V1.0 und V1.2 werden anhand der SHA256 der tatsächlich installierten `phnixIot4G`-Binärdatei erkannt und als „unterstützt“ angezeigt. Unbekannte Builds werden weiterhin vor dem OTA sicher abgelehnt, einschließlich verständlicher Begründung.
            - **Neuer Button „DTU-Version auslesen“:** Zeigt die im originalen `/data/phnixIot_device_OTA_INFO` gespeicherte Version (Offset 0x1C) und den unabhängig geprüften Dienst-Build an; Unterschiede werden kenntlich gemacht. Keine Veränderungen auf der DTU.
            - **Erweiterte LTE-Diagnose:** DTU-Systemzeit (UTC), Uptime, geschätzte Zeitbasis, `time_daemon`, vorhandene RTC-Schnittstellen sowie getrennte Linux-Netzwerk-/MQTT-Indikatoren.
            - **Diagnose-ZIP erweitert:** Versionsquellen, eindeutig als Host-/DTU-Zeit bezeichnete Zeitangaben und C36E-Ereignisprotokoll.
            - **DTU V1.0 Supervisor:** Kontrollierter Neustart toleriert länger dauernde Watchdog-Übergänge (bis 120 Sekunden); zusätzliche PID-/Watchdog-Diagnose bei weiterhin zwingend stabiler, eindeutig einzelner und nicht getracten Dienstinstanz.
            - **DTU V1.0 C36E-Diagnose:** Anfangs- und Letztstatus sowie Anzahl/Duplikate aus vorhandenen GDB-Meldungen. Bestätigter Mainboard-Status 5 und Board-Step 12 bleiben unverändert die Erfolgskriterien.
            - Beide DTU-Builds V1.0 und V1.2 bleiben durch SHA256/ELF-Build-ID exakt gepinnt. Der bestehende V1.2-OTA-Hook/Supervisor bleibt unverändert.

            ### Hinweise
            - DTU-Software V1.0/V1.2 ist **nicht** gleich Mainboard-Firmware V3.4/V3.5.
            - Eine Linux-Systemzeit aus dem Jahr 1980 bedeutet nicht automatisch fehlende SIM-/Cloudverbindung. Die Modemuhr und NITZ werden **nicht** aktiv per AT abgefragt, solange kein sicherer exklusiver Modemzugriff geprüft ist.
            - Netzwerkrouten und MQTT-TCP-Sitzungen sind Diagnosehinweise, **kein Nachweis** einer Kontozuordnung. Die offenen Modem-/NITZ-/Cloud-Forschungsfragen bleiben in Issue #68 dokumentiert.
            - Der bislang produktive V1.0-Supervisor wurde auf echter DTU-Hardware mehrfach erfolgreich getestet. Die zusätzlichen Diagnose- und Neustartänderungen aus v0.5.3 wurden im automatisierten Test und Windows-Testbuild geprüft.
            - Portable ZIP und Setup EXE sind nicht kommerziell code-signiert und können Windows SmartScreen auslösen.
            - ADB/Android Platform Tools sind separat erforderlich; lokaler ADB- und Remote-ADB-Modus bleiben unterstützt.

          files: |
            dist/FoxAir_Updater_Portable_v${{ env.RELEASE_VERSION }}.zip
            updater/windows/installer/Output/FoxAir_Updater_Setup_v${{ env.RELEASE_VERSION }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
